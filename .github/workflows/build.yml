name: Build

# Builds PrintView3D for Windows and Linux on every push and pull request.
# A release is published automatically when the version in
# src/printview3d/__init__.py is new (pushed to main), or when a v* tag is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build translations and run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/i18n.py compile
          python tests/make_samples.py
          python -m pytest -q tests

      - name: FreeCAD test (installs the real FreeCAD and converts a document with it)
        # Downloading FreeCAD can fail on the CI side; that must not block a release.
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        env:
          PRINTVIEW3D_REAL_FREECAD: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          choco install freecad -y --no-progress | Select-Object -Last 3
          $out = python -m pytest -q -s -rA --tb=short tests/test_freecad.py -k real_freecad 2>&1 | Out-String
          Write-Output $out
          $code = $LASTEXITCODE
          # Report the important lines where they can be seen without the log.
          $lines = $out -split "`r?`n" | Where-Object { $_ -match '^(E |FAILED|PASSED|STEP parts|Using FreeCAD|NOTE)' -or $_ -match 'Error' }
          Write-Output ("::warning title=Real FreeCAD tests::" + (($lines | Select-Object -First 40) -join " | "))
          exit $code

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean printview3d.spec

      - name: Smoke test (render a sample to an image)
        # CI machines have no real GPU; never let this step hang or fail the build.
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PrintView3D\PrintView3D.exe" -ArgumentList 'tests\data\cylinder.gcode','--screenshot','smoke.png' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Warning "Smoke test timed out (no GPU on CI)" }
          if (Test-Path smoke.png) { Write-Host "Smoke test OK" } else { Write-Warning "No image produced (CI has no OpenGL)" }

      - name: Mica test (Windows 11 transparency; never blocks the build)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          # A colourful wallpaper, so the Mica tint can be seen on the screenshot.
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          $wall = Join-Path $env:RUNNER_TEMP "wall.bmp"
          $bmp = New-Object System.Drawing.Bitmap 1920, 1080
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $r = New-Object System.Drawing.Rectangle 0, 0, 1920, 1080
          $br = New-Object System.Drawing.Drawing2D.LinearGradientBrush($r, [System.Drawing.Color]::FromArgb(40, 90, 220), [System.Drawing.Color]::FromArgb(230, 110, 60), 35)
          $g.FillRectangle($br, $r); $bmp.Save($wall, [System.Drawing.Imaging.ImageFormat]::Bmp); $g.Dispose(); $bmp.Dispose()
          Add-Type 'using System.Runtime.InteropServices; public class W { [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern bool SystemParametersInfo(int a, int b, string c, int d); }'
          [W]::SystemParametersInfo(20, 0, $wall, 3) | Out-Null
          $exe = "dist\PrintView3D\PrintView3D.exe"
          # 1) Does Windows accept Mica for our window?
          $p = Start-Process $exe -ArgumentList '--backdrop', 'acrylic', '--theme', 'dark', '--mica-selftest' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill() }
          $json = if (Test-Path mica-selftest.json) { Get-Content mica-selftest.json -Raw } else { "no result" }
          Write-Output "::notice title=Mica self-test::$json  (backdrop 3 = Acrylic; dark_mode 1 = dark, 0 = light; Windows build $([Environment]::OSVersion.Version.Build))"
          # 2) What it looks like: a real screenshot of the desktop with PrintView3D open.
          $p = Start-Process $exe -ArgumentList '--mica', 'examples\demo_plate.3mf' -PassThru
          Start-Sleep -Seconds 20
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $sg = [System.Drawing.Graphics]::FromImage($shot)
          $sg.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $shot.Save("mica-screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          if (-not $p.HasExited) { $p.Kill() }
          Write-Output "Screenshot $($b.Width)x$($b.Height) saved"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mica-test-windows
          path: |
            mica-screenshot.png
            mica-selftest.json
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          Copy-Item install_windows.bat, uninstall_windows.bat, LICENSE dist\PrintView3D\
          Copy-Item -Recurse examples dist\PrintView3D\examples
          Compress-Archive -Path dist\PrintView3D\* -DestinationPath PrintView3D-windows.zip

      - name: Build the File Explorer thumbnail provider (C++) and test it
        shell: pwsh
        run: |
          $v = (Select-String -Path src\printview3d\__init__.py -Pattern '__version__ = "(.+?)"').Matches[0].Groups[1].Value
          Push-Location packaging\windows\thumbnails
          cmd /c build.bat $v
          if ($LASTEXITCODE -ne 0) { throw "Thumbnail provider build failed" }
          Pop-Location
          $dll = "packaging\windows\thumbnails\out\PrintView3DThumbnails-$v.dll"
          & packaging\windows\thumbnails\out\test_thumbs.exe dll $dll examples\demo_plate.3mf examples\demo_bracket.FCStd examples\demo_vase.gcode examples\demo_vase.stl tests\data\cube_ascii.stl tests\data\cube_binary.stl
          if ($LASTEXITCODE -ne 0) { throw "Thumbnail test failed" }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = (Select-String -Path src\printview3d\__init__.py -Pattern '__version__ = "(.+?)"').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$v" packaging\windows\PrintView3D.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Copy-Item dist\PrintView3D-Setup.exe .
          Get-Item PrintView3D-Setup.exe | Format-List Name, Length

      - name: Test the installer (silent install, check, uninstall)
        timeout-minutes: 15
        shell: pwsh
        run: |
          try {
            $dir = "$env:LOCALAPPDATA\Programs\PrintView3D"
            $p = Start-Process .\PrintView3D-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=fileassoc,thumbnails','/LOG=install.log' -PassThru -Wait
            if ($p.ExitCode -ne 0) { Get-Content install.log; throw "Install failed ($($p.ExitCode))" }
            if (-not (Test-Path "$dir\PrintView3D.exe")) { throw "PrintView3D.exe not installed" }
            $ver = (Get-Item "$dir\PrintView3D.exe").VersionInfo.ProductVersion
            Write-Host "Installed version: $ver"
            if (-not (Test-Path "HKCU:\Software\Classes\Applications\PrintView3D.exe")) { throw "Open-with registration missing" }
            $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PrintView3D.lnk"
            if (-not (Test-Path $lnk)) { throw "Start menu shortcut missing" }
            # Taskbar icon: the shortcut must carry the app ID PrintView3D gives itself ...
            $sh = New-Object -ComObject Shell.Application
            $aumid = $sh.Namespace((Split-Path $lnk)).ParseName((Split-Path $lnk -Leaf)).ExtendedProperty("System.AppUserModel.ID")
            Write-Output "::notice title=Shortcut app ID::$aumid"
            if ($aumid -ne "PrintView3D.Viewer") { throw "Start menu shortcut has app ID '$aumid', expected PrintView3D.Viewer" }
            # ... and the window must tell Windows its app ID, icon and command.
            $st = Join-Path $env:RUNNER_TEMP "selftest"
            New-Item -ItemType Directory -Force $st | Out-Null
            $p = Start-Process "$dir\PrintView3D.exe" -ArgumentList '--taskbar-selftest' -WorkingDirectory $st -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Taskbar self-test did not finish" }
            $json = Get-Content (Join-Path $st "taskbar-selftest.json") -Raw
            Write-Output "::notice title=Window taskbar properties::$json"
            $t = $json | ConvertFrom-Json
            if (-not $t.set -or $t.read.id -ne "PrintView3D.Viewer" -or $t.read.icon -notlike "*PrintView3D.exe,0") {
              throw "The window's taskbar properties are not set: $json"
            }
            if (-not (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\.3mf\ShellEx\{e357fccd-a995-4576-b01f-234630154e96}")) { throw "Thumbnail provider not registered" }
            foreach ($e in '.3mf','.stl','.gcode','.gco','.fcstd') {
              if (-not (Test-Path "HKCU:\Software\Classes\$e\ShellEx\{e357fccd-a995-4576-b01f-234630154e96}")) { throw "Thumbnail provider not registered for $e" }
            }
            # What File Explorer gets: ask the Windows shell itself for thumbnails.
            # The CI account runs elevated, and elevated programs ignore per-user (HKCU) COM classes, a
            # Windows security rule. File Explorer runs unelevated, so it uses the per-user registration.
            # For this test only, the class is copied to HKLM and removed again afterwards.
            $label = (whoami /groups | Select-String 'Mandatory Label') -replace '\s{2,}.*$',''
            Write-Output "::notice title=Test process::$label"
            $ck = 'Software\Classes\CLSID\{64535B54-55A8-4412-919A-88F46D3E3B86}'
            reg copy "HKCU\$ck" "HKLM\$ck" /s /f | Out-Null
            try {
              $out = & packaging\windows\thumbnails\out\test_thumbs.exe shell examples\demo_plate.3mf examples\demo_bracket.FCStd examples\demo_vase.gcode examples\demo_vase.stl 2>&1 | Out-String
              Write-Output $out
              Write-Output ("::notice title=Shell thumbnails::" + ($out -replace "`r?`n", " | "))
              if ($LASTEXITCODE -ne 0) { $global:shellthumb = 1 }
            } finally {
              reg delete "HKLM\$ck" /f | Out-Null
              # The COM surrogate keeps the DLL loaded for a while; the update test below reinstalls the same version.
              Get-Process dllhost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            $un = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { $_.PSChildName -like '*f46ac51f*' }
            if (-not $un) { throw "Not listed in Apps & features" }
            # Update the way PrintView3D does it from Settings -> Updates: the new version must start by itself.
            # Not "-Wait": that also waits for programs the installer starts, i.e. the restarted PrintView3D.
            $p = Start-Process .\PrintView3D-Setup.exe -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/UPDATE=1' -PassThru
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Update install did not finish" }
            if ($p.ExitCode -ne 0) { throw "Update install failed ($($p.ExitCode))" }
            $started = $null
            for ($i = 0; $i -lt 30 -and -not $started; $i++) { Start-Sleep -Seconds 1; $started = Get-Process PrintView3D -ErrorAction SilentlyContinue }
            if (-not $started) { throw "The updated program did not start again after the update" }
            $started | Stop-Process -Force
            Start-Sleep -Seconds 2
            Write-Host "Update mode OK (program restarted after update)"
            $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
            # The uninstaller hands over to a copy of itself; wait until it is done.
            for ($i = 0; $i -lt 60 -and (Test-Path "$dir\PrintView3D.exe"); $i++) { Start-Sleep -Seconds 1 }
            Start-Sleep -Seconds 2
            if (Test-Path "$dir\PrintView3D.exe") { throw "Uninstall left the program behind" }
            if (Test-Path "HKCU:\Software\Classes\Applications\PrintView3D.exe") { throw "Uninstall left the registration behind" }
            if (Test-Path $lnk) { throw "Uninstall left the shortcut behind" }
            if (Test-Path "HKCU:\Software\Classes\CLSID\{64535B54-55A8-4412-919A-88F46D3E3B86}") { throw "Uninstall left the thumbnail provider behind" }
            foreach ($e in '.3mf','.stl','.gcode','.gco','.fcstd') {
              if (Test-Path "HKCU:\Software\Classes\$e\ShellEx\{e357fccd-a995-4576-b01f-234630154e96}") { throw "Uninstall left the thumbnail handler behind for $e" }
            }
            if ($global:shellthumb) { throw "Shell thumbnail test failed" }
            Write-Host "Installer test OK"
          } catch { Write-Output "::error title=Installer test::$($_.Exception.Message)"; throw }

      - uses: actions/upload-artifact@v7
        with:
          name: PrintView3D-windows
          path: |
            PrintView3D-windows.zip
            PrintView3D-Setup.exe

  linux:
    # Built on an older Ubuntu so the AppImage also runs on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        # Qt's X11 libraries (bundled into the AppImage) and a virtual display for the smoke test.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libglu1-mesa libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-render-util0 libxcb-randr0 \
            libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 desktop-file-utils

      - name: Build (tests + AppImage)
        run: ./build_linux.sh

      - name: Smoke test (render a sample to an image)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 xvfb-run -a -s "-screen 0 1400x900x24" \
            dist/PrintView3D-x86_64.AppImage tests/data/cylinder.gcode --screenshot smoke-linux.png
          test -f smoke-linux.png && echo "Smoke test OK"

      - uses: actions/upload-artifact@v7
        with:
          name: PrintView3D-linux
          path: dist/PrintView3D-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-linux
          path: smoke-linux.png
          if-no-files-found: ignore

  macos:
    # Apple silicon (M1 and newer). Ad-hoc signed, not notarized: no paid Apple account.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build translations and run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/i18n.py compile
          python tests/make_samples.py
          python -m pytest -q tests

      - name: Build PrintView3D.app
        run: pyinstaller --noconfirm --clean printview3d.spec

      - name: Sign (ad-hoc) and check the signature
        # A broken signature makes macOS say "the app is damaged" with no way round it,
        # so the build fails here instead.
        run: |
          codesign --force --deep --sign - dist/PrintView3D.app
          codesign --verify --deep --strict --verbose=2 dist/PrintView3D.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/PrintView3D.app/Contents/Info.plist

      - name: Smoke test (render a sample to an image)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          dist/PrintView3D.app/Contents/MacOS/PrintView3D tests/data/cylinder.gcode --screenshot smoke-mac.png &
          pid=$!; for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done; kill $pid 2>/dev/null || true
          test -f smoke-mac.png && echo "Smoke test OK"

      - name: Make the .dmg
        run: |
          mkdir dmg
          cp -R dist/PrintView3D.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname PrintView3D -srcfolder dmg -ov -format UDZO PrintView3D-macOS-AppleSilicon.dmg
          # The app inside the .dmg must still have an intact signature.
          hdiutil attach -nobrowse -readonly PrintView3D-macOS-AppleSilicon.dmg -mountpoint /tmp/pv3d
          codesign --verify --deep --strict /tmp/pv3d/PrintView3D.app && echo "Signature inside the .dmg OK"
          hdiutil detach /tmp/pv3d

      - uses: actions/upload-artifact@v7
        with:
          name: PrintView3D-macos
          path: PrintView3D-macOS-AppleSilicon.dmg

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-macos
          path: smoke-mac.png
          if-no-files-found: ignore

  release:
    needs: [windows, linux, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04      # fixed version, so GitHub's move of "latest" to Ubuntu 26 changes nothing
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/printview3d/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $v"

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.released == 'false'
        run: |
          python3 - <<'PY'
          import re
          v = "${{ steps.version.outputs.version }}"
          log = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"## " + re.escape(v) + r"\s*(.*?)(?=\n## |\Z)", log, re.S)
          repo = "https://github.com/${{ github.repository }}"
          notes = f"""## Download

          | System | File | How to install |
          |---|---|---|
          | **Windows 10/11** | `PrintView3D-Setup.exe` | Double-click and follow the steps (no admin rights needed) |
          | Windows, portable | `PrintView3D-windows.zip` | Extract and run `PrintView3D.exe`, nothing is installed |
          | **Linux** (x86-64) | `PrintView3D-x86_64.AppImage` | Make it executable and run it ([details]({repo}#linux)) |
          | **macOS 12+ (Apple silicon), beta** | `PrintView3D-macOS-AppleSilicon.dmg` | Open, drag to Applications, first start: System Settings → Privacy & Security → **Open Anyway** ([details]({repo}#macos)) |

          No Python needed. See the [README]({repo}#install) for details.

          ## What's new

          """
          notes = "\n".join(l.strip() if l.strip().startswith("|") or not l.strip() else l.lstrip()
                            for l in notes.splitlines())
          notes += (m.group(1).strip() if m else "")
          open("release_notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
          cat release_notes.md

      - uses: actions/download-artifact@v8
        if: startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.released == 'false'
        with:
          pattern: PrintView3D-*
          merge-multiple: true

      - name: Publish release
        id: publish
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' && steps.version.outputs.released == 'false')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: PrintView3D ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            PrintView3D-Setup.exe
            PrintView3D-windows.zip
            PrintView3D-x86_64.AppImage
            PrintView3D-macOS-AppleSilicon.dmg

  # A new release also goes to the Windows Package Manager ("winget install PrintView3D").
  winget:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
